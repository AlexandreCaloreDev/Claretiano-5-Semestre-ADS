<ion-header
  ><ion-toolbar
    ><ion-buttons slot="start"
      ><ion-back-button
        defaultHref="/lista-chamados"
      ></ion-back-button></ion-buttons
    ><ion-title>Atualizar Status</ion-title></ion-toolbar
  ></ion-header
>
<ion-content class="ion-padding"
  ><div *ngIf="chamado; else vazio">
    <ion-item
      ><ion-select
        label="Status"
        labelPlacement="stacked"
        name="status"
        [(ngModel)]="status"
        ><ion-select-option *ngFor="let item of statusLista" [value]="item"
          >{{ item }}</ion-select-option
        ></ion-select
      ></ion-item
    ><ion-item
      ><ion-textarea
        label="Observacao"
        labelPlacement="stacked"
        name="observacao"
        [(ngModel)]="observacao"
      ></ion-textarea></ion-item
    ><ion-button expand="block" (click)="salvar()"
      >Salvar Atualizacao</ion-button
    >
  </div>
  <ng-template #vazio
    ><p class="vazio">Chamado nao encontrado.</p></ng-template
  ></ion-content
>
