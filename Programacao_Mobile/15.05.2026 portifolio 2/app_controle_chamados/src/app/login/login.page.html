<ion-header>
  <ion-toolbar><ion-title>Controle de Chamados</ion-title></ion-toolbar>
</ion-header>
<ion-content class="ion-padding">
  <div>
    <ion-item>
      <ion-input
        label="Usuario"
        labelPlacement="stacked"
        name="usuario"
        [(ngModel)]="usuario">
      </ion-input>
    </ion-item>
    <ion-item>
      <ion-input
        label="Senha"
        labelPlacement="stacked"
        type="password"
        name="senha"
        [(ngModel)]="senha">
      </ion-input>
    </ion-item>
    <ion-text class="erro" *ngIf="mensagem">{{ mensagem }}</ion-text>
    <ion-button expand="block" (click)="entrar()">Entrar</ion-button>
  </div>
</ion-content>
